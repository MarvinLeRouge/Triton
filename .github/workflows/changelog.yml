name: Update Changelog

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "CHANGELOG.md"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # git-cliff needs the full commit history, not a shallow clone
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Only the "Unreleased" section is regenerated: tagged version sections
      # are frozen history and must never be rewritten by this workflow.
      - name: Regenerate changelog
        run: |
          awk '/^## \[[0-9]/{print; found=1; next} found' CHANGELOG.md > /tmp/changelog_frozen.md
          npx --yes git-cliff@2.13.1 --config cliff.toml --unreleased --output /tmp/changelog_unreleased.md
          cat /tmp/changelog_unreleased.md /tmp/changelog_frozen.md > CHANGELOG.md

      # main is protected: no direct push, so open a PR instead of committing
      # straight to it. Reuses the same branch across runs, updating the
      # existing open PR rather than piling up new ones.
      - name: Open pull request if changed
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: CHANGELOG.md
          commit-message: "chore(changelog): update CHANGELOG.md"
          title: "chore(changelog): update CHANGELOG.md"
          body: Automated CHANGELOG.md regeneration via git-cliff, triggered by a push to main.
          branch: chore/update-changelog
          delete-branch: true
          labels: changelog
