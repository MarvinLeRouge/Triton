name: Changelog

on:
  push:
    branches:
      - main
    paths-ignore:
      - CHANGELOG.md

permissions:
  contents: write
  pull-requests: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Strip previous auto-generated Unreleased section
        run: |
          python3 - <<'EOF'
          import re

          path = "CHANGELOG.md"
          content = open(path).read()
          content = re.sub(
              r"^## \[Unreleased\]\n.*?(?=^## \[|\Z)",
              "",
              content,
              count=1,
              flags=re.M | re.S,
          )
          open(path, "w").write(content)
          EOF

      - name: Regenerate Unreleased section with git-cliff
        run: npx --yes git-cliff --config cliff.toml --unreleased --prepend CHANGELOG.md

      - name: Open or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "docs(root): update changelog unreleased section"
          branch: chore/changelog-update
          delete-branch: true
          title: "docs(root): update changelog unreleased section"
          body: >
            Automated update of the `[Unreleased]` section in `CHANGELOG.md`,
            generated by git-cliff from Conventional Commits since the last
            release tag.
