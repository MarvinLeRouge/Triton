default_install_hook_types: [pre-commit, post-commit]

repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan, staged changes)
        entry: bash -c 'command -v gitleaks >/dev/null || { echo "gitleaks not found, install it (https://github.com/gitleaks/gitleaks) to scan staged changes for secrets" >&2; exit 1; }; gitleaks git --pre-commit --staged --redact --no-banner'
        language: system
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        args: [engine, api]
        pass_filenames: false

      - id: prettier-frontend
        name: prettier (frontend)
        entry: npm --prefix frontend run format
        language: system
        files: ^frontend/src/
        pass_filenames: false

      - id: eslint-frontend
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/src/
        pass_filenames: false

      - id: vue-tsc-frontend
        name: vue-tsc (frontend)
        entry: npm --prefix frontend run type-check
        language: system
        files: ^frontend/src/
        pass_filenames: false

      - id: changelog
        name: Update CHANGELOG.md (git-cliff)
        entry: bash scripts/changelog-post-commit.sh
        language: system
        stages: [post-commit]
        pass_filenames: false
        always_run: true
